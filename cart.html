    <h1>🛒 장바구니</h1>
    <hr>
    <div>
        <p>선택하신 상품: <b>상품 A (1개)</b> - 50,000원</p>
        <button id="checkout-btn" style="padding: 10px 20px; font-size: 16px; background-color: json; cursor: pointer;">주문하기 (결제 시작)</button>
    </div>

    <script>
        document.getElementById('checkout-btn').addEventListener('click', function() {
            // GA4 표준 규격 'begin_checkout'
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
                'event': 'begin_checkout',
                'ecommerce': {
                    'currency': 'KRW',
                    'value': 50000,
                    'items': [{
                        'item_id': 'PROD_12345',
                        'item_name': '테스트 상품 A',
                        'price': 50000,
                        'quantity': 1
                    }]
                }
            });
            
            alert('결제를 시작합니다. 가상 완료 페이지로 이동합니다.');
            location.href = 'thankyou.html'; // 완료 페이지로 이동
        });
    </script>
